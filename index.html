<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        PDS — Planning & Design Section
    </title>


    <!-- =====================================================
         PDS STYLES
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <!-- =====================================================
         GOOGLE FONTS
    ====================================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Oswald:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- =====================================================
         SUPABASE
    ====================================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>


<body>


<!-- =========================================================
     AUTH SCREEN
========================================================= -->

<div id="authScreen">

    <div class="auth-container">


        <!-- DPWH LOGO -->

        <div class="auth-logo">
            DPWH
        </div>


        <!-- TITLE -->

        <h1>
            Planning & Design
        </h1>


        <p>
            Department of Public Works and Highways
        </p>


        <div class="auth-section-label">
            PLANNING & DESIGN SECTION
        </div>


        <!-- LOGIN -->

        <form id="loginForm">


            <div class="form-group">

                <label for="loginEmail">
                    EMAIL ADDRESS
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email Address"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    PASSWORD
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                SIGN IN
            </button>


        </form>


        <div
            id="loginMessage"
            class="auth-message"
        ></div>


        <div class="auth-footer">

            <span>
                PDS CONTROL DESK
            </span>

            <span>
                •
            </span>

            <span>
                DPWH
            </span>

        </div>


    </div>

</div>



<!-- =========================================================
     MAIN APPLICATION
========================================================= -->

<div id="app">


    <aside class="sidebar">

        <!-- BRAND -->
        <div class="brand">

            <div class="brand-logo-wrap">
                <img
                    src="assets/dpwh-logo.png"
                    alt="DPWH Logo"
                    class="dpwh-logo"
                    onerror="
                        this.style.display='none';
                        this.nextElementSibling.style.display='flex';
                    "
                >
                <div
